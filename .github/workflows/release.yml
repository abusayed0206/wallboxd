name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $cargoVersion) {
            Write-Error "Tag version ($tag) does not match Cargo.toml version ($cargoVersion). Bump Cargo.toml before tagging."
            exit 1
          }
          # AppxManifest.xml's Version carries an extra ".0" (4th component,
          # required to stay 0 for Store submission - see packaging/README.md).
          # Parsed as real XML (not a regex over the raw text) so attribute
          # order/spacing changes can't silently break or mismatch this -
          # confirmed: a harmless reformat (e.g. spaces around `=`) makes a
          # hand-rolled regex return an empty match with no error, while this
          # still reads the correct value regardless of formatting.
          [xml]$manifestXml = Get-Content packaging/AppxManifest.xml -Raw
          $manifestVersion = $manifestXml.Package.Identity.Version
          if ($manifestVersion -ne "$tag.0") {
            Write-Error "AppxManifest.xml Version ($manifestVersion) does not match tag ($tag.0). Bump packaging/AppxManifest.xml before tagging."
            exit 1
          }

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package plain exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $stageDir = "dist/Wallboxd-$version-windows-x64"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item target/release/Wallboxd.exe -Destination $stageDir
          Compress-Archive -Path "$stageDir/*" -DestinationPath "dist/Wallboxd-$version-windows-x64.zip"

      - name: Package MSIX
        id: package_msix
        shell: pwsh
        # Isolated from the rest of the release: this step exercises the
        # Windows SDK tool lookup (Find-SdkTool in build-msix.ps1) and
        # makeappx, neither of which ci.yml runs on every push, so a tagged
        # release could be the first time either is exercised against a
        # given runner image. A failure here shouldn't cost the zip asset,
        # which already built successfully by this point.
        continue-on-error: true
        run: |
          .\packaging\build-msix.ps1 -SkipBuild
          $version = "${{ github.ref_name }}"
          Copy-Item packaging/build/Wallboxd.msix -Destination "dist/Wallboxd-$version-windows-x64.msix"

      - name: Warn if MSIX packaging failed
        if: steps.package_msix.outcome == 'failure'
        shell: pwsh
        run: Write-Warning "MSIX packaging failed - releasing the plain exe zip only, no .msix asset this time. Check the 'Package MSIX' step's log."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit extensions, not `dist/*` - the exe zip's staging step
          # also leaves the loose `dist/Wallboxd-*-windows-x64/` directory
          # behind (confirmed locally), which a bare `dist/*` glob would
          # also pick up and try to upload as a release asset. `dist/*.msix`
          # simply won't match anything if the MSIX packaging step above
          # failed (continue-on-error: true) - fail_on_unmatched_files:false
          # makes that an empty match, not a broken release.
          files: |
            dist/*.zip
            dist/*.msix
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            **Two downloads:**
            - `Wallboxd-*-windows-x64.zip` - plain exe, no installer. Simplest option, but can't set the lock screen (needs package identity).
            - `Wallboxd-*-windows-x64.msix` - unsigned MSIX. Enables the lock screen feature, but Windows won't install an unsigned package by default - see [`packaging/README.md`](https://github.com/${{ github.repository }}/blob/main/packaging/README.md#local-build--test-sideload) for the local test-signing + sideloading steps. For a normal signed install, use the Microsoft Store listing instead once it's live.
