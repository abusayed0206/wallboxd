name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $cargoVersion) {
            Write-Error "Tag version ($tag) does not match Cargo.toml version ($cargoVersion). Bump Cargo.toml before tagging."
            exit 1
          }

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $stageDir = "dist/Wallboxd-$version-windows-x64"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item target/release/Wallboxd.exe -Destination $stageDir
          Compress-Archive -Path "$stageDir/*" -DestinationPath "dist/Wallboxd-$version-windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
